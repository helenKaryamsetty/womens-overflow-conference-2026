<main class="welcome-shell">
  <div class="welcome-card">
    <div class="welcome-flower flower-one" aria-hidden="true"></div>

    <header class="brand-block" aria-label="Women’s Overflow conference brand">
      <div class="wordmark-top">WOMEN’S</div>
      <div class="wordmark-bottom">Overflow</div>
      <p class="conference-caption">WOMEN’S CONFERENCE</p>
    </header>

    <section class="welcome-copy">
      <p class="tagline">Filled with Grace.<br />Overflowing in Purpose.</p>
    </section>

    <button type="button" class="primary-action" (click)="goToCheckIn()">
      Get Started <span aria-hidden="true">→</span>
    </button>
  </div>
</main>
